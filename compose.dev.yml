services:
  server:
    build:
      context: ./server/api
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - ./server/api:/app
      - server_deps:/app/deps
      - server_build:/app/_build
    environment:
      - MIX_ENV=dev
      - PORT=4000
      - PHX_HOST=localhost
      - DATABASE_PATH=/app/data/claudiverse_dev.db
    working_dir: /app
    command: sh -c "mix ecto.create && mix ecto.migrate && mix phx.server"

  web:
    image: node:24-slim
    ports:
      - "5173:5173"
    volumes:
      - ./server/web:/app
      - web_node_modules:/app/node_modules
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:4000
    command: sh -c "npm install && npx vite --host 0.0.0.0"
    depends_on:
      - server

volumes:
  server_deps:
  server_build:
  web_node_modules:
