server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed, immutable build assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cheap liveness target for the container HEALTHCHECK.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA: every other path falls back to index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
